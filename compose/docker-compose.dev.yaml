services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo-dev.js:/docker-entrypoint-initdb.d/01-init-mongo-dev.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: telitest
    restart: unless-stopped
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command:
      - start-dev
      - --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_dev_data:/opt/keycloak/data
      - ./keycloak/realm-dev.json:/opt/keycloak/data/import/teli-realm.json:ro
    mem_limit: 1g

volumes:
  mongodb_data:
  keycloak_dev_data:
