services:
  api:
    image: ${API_IMAGE:?Required}
    restart: unless-stopped
    environment:
      API_HOST: "0.0.0.0"
      MONGO_USER: ${TELIAPI_MONGO_USER:?Required}
      MONGO_PASSWORD: ${TELIAPI_MONGO_PASSWORD:?Required}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DBNAME: teliapi2
      KEYCLOAK_ISSUER: ${TELIAPI_KEYCLOAK_ISSUER:?Required}

  front:
    image: ${FRONTEND_IMAGE:?Required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:80"

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Required}
      TELIAPI_MONGO_USER: ${TELIAPI_MONGO_USER:?Required}
      TELIAPI_MONGO_PASSWORD: ${TELIAPI_MONGO_PASSWORD:?Required}
    volumes:
      - mongo_data:/data/db
      - ./init-mongo-prod.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command:
      - start
      - --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?Required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Required}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Required}

      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://your-university-host.example/teli/auth
      KC_HTTP_RELATIVE_PATH: /teli/auth

      KC_HEALTH_ENABLED: "true"

    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-prod.json:/opt/keycloak/data/import/teli-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    mem_limit: 1g

  keycloak-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?Required}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  keycloak_db_data:

